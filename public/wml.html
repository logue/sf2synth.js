<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Web Midi Link</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@logue/sf2synth@latest/dist/style.css"
    />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-2Y2FW3QEG4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-2Y2FW3QEG4');
    </script>
  </head>

  <body>
    <div class="container-fluid">
      <header>
        <div class="d-flex justify-content-between">
          <h1 class="h2">
            SoundFont:
            <span id="soundfont"></span>
          </h1>
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              id="toggleDarkMode"
            />
            <label class="form-check-label" for="toggleDarkMode">
              Dark Mode
            </label>
            &nbsp;
            <a
              href="https://github.com/logue/sf2synth.js"
              target="_blank"
              class="text-muted"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-github"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                />
              </svg>
            </a>
          </div>
        </div>
        <p class="text-end">
          <a href="https://logue.dev/" target="_blank">Logue</a>
          /
          <small class="text-muted">
            Last Modified:
            <time id="build"></time>
          </small>
        </p>
      </header>
      <main>
        <div class="alert alert-danger d-flex align-items-center" role="alert">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-exclamation-triangle-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
            />
          </svg>
          <div>
            This address is retained for compatibility and is deprecated. Please
            change
            <code>wml</code>
            url to
            <a href="https://logue.dev/sf2synth.js/">
              https://logue.dev/sf2synth.js/
            </a>
            .
          </div>
        </div>
        <div id="drag">
          <label class="form-label" for="file">Load SoundFont2 file</label>
          <input
            type="file"
            class="form-control"
            id="file"
            accept="audio/x-soundfont"
            aria-describedby="fileHelp"
          />
          <div id="fileHelp" class="form-text">
            drag and drop here *.sf2 file to change sound font.
          </div>
        </div>
        <hr />
        <div id="placeholder"></div>
      </main>
    </div>
    <script type="module">
      import qs from 'https://cdn.jsdelivr.net/npm/query-string@8.1.0/+esm';
      import SoundFont from 'https://cdn.jsdelivr.net/npm/@logue/sf2synth@latest/+esm';

      /** sf2synth.js Option */
      const options = Object.assign(
        {
          sf: 'Yamaha XG Sound Set.sf2',
          ui: true,
          placeholder: 'placeholder',
          colorMode: 'auto',
        },
        qs.parse(window.location.search)
      );

      document.addEventListener(
        'DOMContentLoaded',
        event => {
          /** @type {HTMLDivElement} Message DOM */
          const message = document.getElementById('message');
          /** @type {HTMLInputElement} File Input Form */
          const fileInput = document.getElementById('file');
          /** @type {HTMLDivElement} Placeholder */
          const placeholder = document.getElementById('placeholder');
          /** @type {HTMLDivElement} drag area */
          const dragArea = document.getElementById('drag');
          /** @type {HTMLTimeElement} Build Date */
          const build = document.getElementById('build');
          /** @type {HTMLInputElement} */
          const toggleDarkMode = document.getElementById('toggleDarkMode');

          /** SoundFont file */
          const sf = decodeURIComponent(options.sf);

          document.getElementById('soundfont').innerText = sf;
          build.dateTime = SoundFont.build;
          build.innerText = new Date(SoundFont.build).toLocaleString();

          if (options.colorMode !== 'auto') {
            setColorMode(options.colorMode);
          }

          /** WebMidiLink */
          const wml = new SoundFont.WebMidiLink(options);

          wml.setLoadCallback(() => {
            dragArea.classList.remove('bg-info');
          });
          wml.setup(sf);

          // Keep an eye out for System Light/Dark Mode Changes
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          mediaQuery.addListener(() => {
            // Ignore change if there's an override set
            if (
              document.documentElement.getAttribute('data-force-color-mode')
            ) {
              return;
            }

            // Make sure the checkbox is up-to-date
            toggleDarkMode.checked = mediaQuery.matches;
          });

          /** Load sound font
           * @param {File} file
           */
          const handleSoundFont = file => {
            const reader = new FileReader();

            // wml.cancelLoading();

            reader.readAsArrayBuffer(file);

            reader.onload = e => {
              document.getElementById('soundfont').innerText = file.name;
              const data = new Uint8Array(e.target.result);
              wml.setupByBuffer(data);
            };
          };

          fileInput.addEventListener(
            'change',
            event => {
              event.preventDefault();
              handleSoundFont(fileInput.files[0]);
              fileInput.value = '';
            },
            false
          );

          dragArea.addEventListener(
            'drop',
            event => {
              const dt = event.dataTransfer;
              if (dt.files.length) {
                event.preventDefault();
                event.stopPropagation();
                handleSoundFont(dt.files[0]);
              }
              dragArea.classList.remove('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragover',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.add('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragleave',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.remove('bg-info');
            },
            false
          );

          toggleDarkMode.addEventListener('change', e => {
            setColorMode(e.target.checked ? 'dark' : 'light');
          });

          /*
          document
            .getElementById('reset-darkmode')
            .addEventListener('click', e => {
              e.preventDefault();
              setColorMode(false);
            });
          */
        },
        false
      );

      /**
       * Toggle Color Mode.
       *
       * @param {<dark|light|auto>} mode
       */
      const setColorMode = mode => {
        // Mode was given
        if (mode) {
          // Update data-* attr on html
          document.documentElement.setAttribute('data-bs-theme', mode);
          // Persist in local storage
          window.localStorage.setItem('color-mode', mode);
          // Make sure the checkbox is up-to-date
          toggleDarkMode.checked = mode === 'dark';
        }

        // No mode given (e.g. reset)
        else {
          // Remove data-* attr from html
          document.documentElement.setAttribute('data-bs-theme', 'auto');
          // Remove entry from local storage
          window.localStorage.removeItem('color-mode');
          // Make sure the checkbox is up-to-date, matching the system preferences
          toggleDarkMode.checked = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
        }
      };
    </script>
  </body>
</html>
