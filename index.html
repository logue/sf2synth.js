<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Web Midi Link</title>
    <link rel="stylesheet" lang="scss" href="/src/wml.scss" />
  </head>

  <body>
    <div class="container-fluid">
      <header>
        <div class="d-flex justify-content-between">
          <h1 class="h2">
            SoundFont:
            <span id="soundfont"></span>
          </h1>
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              id="toggleDarkMode"
            />
            <label class="form-check-label" for="toggleDarkMode">
              Dark Mode
            </label>
          </div>
        </div>
        <p class="text-end">
          <a href="https://logue.dev/" target="_blank">Logue</a>
          /
          <small class="text-muted">
            Last Modified:
            <time id="build"></time>
          </small>
        </p>
      </header>
      <main>
        <div id="drag">
          <label class="form-label" for="file">
            Load SoundFont2 file
            <small class="text-muted">
              (drag and drop here *.sf2 file to change sound font)
            </small>
          </label>
          <input
            type="file"
            class="form-control"
            id="file"
            accept="audio/x-soundfont"
          />
        </div>
        <hr />
        <div id="placeholder"></div>
      </main>
    </div>
    <script type="module">
      import qs from 'query-string';
      import SoundFont from '/src/index';

      /** sf2synth.js Option */
      const options = Object.assign(
        {
          sf: 'Yamaha XG Sound Set.sf2',
          ui: true,
          placeholder: 'placeholder',
          colorMode: 'auto',
        },
        qs.parse(window.location.search)
      );

      document.addEventListener(
        'DOMContentLoaded',
        event => {
          /** @type {HTMLDivElement} Message DOM */
          const message = document.getElementById('message');
          /** @type {HTMLInputElement} File Input Form */
          const fileInput = document.getElementById('file');
          /** @type {HTMLDivElement} Placeholder */
          const placeholder = document.getElementById('placeholder');
          /** @type {HTMLDivElement} drag area */
          const dragArea = document.getElementById('drag');
          /** @type {HTMLTimeElement} Build Date */
          const build = document.getElementById('build');
          /** @type {HTMLInputElement} */
          const toggleDarkMode = document.getElementById('toggleDarkMode');

          /** SoundFont file */
          const sf = decodeURIComponent(options.sf);

          document.getElementById('soundfont').innerText = sf;
          build.dateTime = SoundFont.build;
          build.innerText = new Date(SoundFont.build).toLocaleString();

          if (options.colorMode !== 'auto') {
            setColorMode(options.colorMode);
          }

          /** WebMidiLink */
          const wml = new SoundFont.WebMidiLink(options);

          wml.setLoadCallback(() => {
            dragArea.classList.remove('bg-info');
          });
          wml.setup(sf);

          // Keep an eye out for System Light/Dark Mode Changes
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          mediaQuery.addListener(() => {
            // Ignore change if there's an override set
            if (
              document.documentElement.getAttribute('data-force-color-mode')
            ) {
              return;
            }

            // Make sure the checkbox is up-to-date
            toggleDarkMode.checked = mediaQuery.matches;
          });

          /** Load sound font
           * @param {File} file
           */
          const handleSoundFont = file => {
            const reader = new FileReader();

            // wml.cancelLoading();

            reader.readAsArrayBuffer(file);

            reader.onload = e => {
              document.getElementById('soundfont').innerText = file.name;
              const data = new Uint8Array(e.target.result);
              wml.setupByBuffer(data);
            };
          };

          fileInput.addEventListener(
            'change',
            event => {
              event.preventDefault();
              handleSoundFont(fileInput.files[0]);
              fileInput.value = '';
            },
            false
          );

          dragArea.addEventListener(
            'drop',
            event => {
              const dt = event.dataTransfer;
              console.log(dt);
              if (dt.files.length) {
                event.preventDefault();
                event.stopPropagation();
                handleSoundFont(dt.files[0]);
              }
              dragArea.classList.remove('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragover',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.add('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragleave',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.remove('bg-info');
            },
            false
          );

          toggleDarkMode.addEventListener('change', e => {
            setColorMode(e.target.checked ? 'dark' : 'light');
          });

          /*
          document
            .getElementById('reset-darkmode')
            .addEventListener('click', e => {
              e.preventDefault();
              setColorMode(false);
            });
          */
        },
        false
      );

      /**
       * Toggle Color Mode.
       *
       * @param {<dark|light|auto>} mode
       */
      const setColorMode = mode => {
        // Mode was given
        if (mode) {
          // Update data-* attr on html
          document.documentElement.setAttribute('data-bs-theme', mode);
          // Persist in local storage
          window.localStorage.setItem('color-mode', mode);
          // Make sure the checkbox is up-to-date
          toggleDarkMode.checked = mode === 'dark';
        }

        // No mode given (e.g. reset)
        else {
          // Remove data-* attr from html
          document.documentElement.setAttribute('data-bs-theme', 'auto');
          // Remove entry from local storage
          window.localStorage.removeItem('color-mode');
          // Make sure the checkbox is up-to-date, matching the system preferences
          toggleDarkMode.checked = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
        }
      };
    </script>
  </body>
</html>
