<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <meta http-equiv="Access-Control-Allow-Methods" content="GET" />
    <meta http-equiv="Access-Control-Allow-Headers" content="*" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Web Midi Link</title>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-2Y2FW3QEG4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-2Y2FW3QEG4');
    </script>
    <link rel="stylesheet" href="/src/wml.scss" />
  </head>

  <body>
    <div class="container-fluid">
      <header>
        <h1 class="h2">
          SoundFont:
          <span id="soundfont"></span>
        </h1>
      </header>
      <main>
        <div class="d-flex justify-content-between">
          <div id="drag">
            <label for="file" class="form-label">Select own *.sf2 file</label>
            <input
              accept="audio/x-soundfont"
              aria-describedby="fileHelp"
              class="form-control"
              id="file"
              type="file"
            />
            <!--
              <select
                class="form-select"
                aria-label="Load SoundFont2 file"
                id="selector"
              >
                <option selected value="Yamaha XG Sound Set.sf2">
                  Yamaha XG SoundFont.sf2
                </option>
                <option value="A320U.sf2">A320U.sf2</option>
              </select>
            -->
            <span id="fileHelp" class="form-text">
              Drag and drop the *.sf2 file here to change the sound font.
            </span>
          </div>
          <div>
            <div class="form-check form-switch">
              <input
                aria-checked="mixed"
                class="form-check-input"
                id="toggleDarkMode"
                role="switch"
                type="checkbox"
              />
              <label class="form-check-label" for="toggleDarkMode">
                Dark Mode
              </label>
              &nbsp;
              <a
                class="text-muted"
                href="https://github.com/logue/sf2synth.js"
                rel="noopener"
                target="_blank"
                title="Github"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-github"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                  />
                </svg>
              </a>
            </div>
          </div>
        </div>
        <hr />
        <div id="placeholder">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </main>
      <footer>
        <p class="text-end">
          <a href="https://logue.dev/" target="_blank" rel="noopener">Logue</a>
          /
          <small class="text-muted">
            Last Modified:
            <time id="build"></time>
          </small>
        </p>
      </footer>
    </div>
    <script type="module">
      import qs from 'query-string';
      import SoundFont from '/src/index';

      /** sf2synth.js Option */
      let options = {
        ...{
          // URL to SoundFont File
          // url: 'https://cdn.jsdelivr.net/npm/@logue/sf2synth@latest/dist/Yamaha XG Sound Set.sf2',
          // Show Keyboard
          drawSynth: true,
          // Target dom id
          placeholder: 'placeholder',
          // Color Mode (auto, dark, light)
          colorMode: 'auto',
        },
        ...qs.parse(window.location.search),
        ...qs.parse(window.location.hash),
      };

      /** @type {typeof import("./src/wml").WebMidiLink } WebMidiLink */
      const wml = new SoundFont.WebMidiLink(options);

      document.addEventListener(
        'DOMContentLoaded',
        event => {
          /** @type {HTMLInputElement} File Input Form */
          const fileInput = document.getElementById('file');
          /** @type {HTMLDivElement} drag area */
          const dragArea = document.getElementById('drag');
          /** @type {HTMLTimeElement} Build Date */
          const build = document.getElementById('build');
          /** @type {HTMLInputElement} */
          const toggleDarkMode = document.getElementById('toggleDarkMode');
          /** @type {HTMLSelectElement} */
          // const selector = document.getElementById('selector');

          wml.setLoadCallback(() => {
            dragArea.classList.remove('bg-info');
            document.getElementById('soundfont').innerText = decodeURIComponent(
              wml.getUrl()
            ).match('.+/(.+?)([?#;].*)?$')[1];
          });

          // Apply build time
          build.dateTime = SoundFont.build;
          build.innerText = new Date(SoundFont.build).toLocaleString();

          wml.setup();

          // Keep an eye out for System Light/Dark Mode Changes
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          mediaQuery.addListener(() => {
            // Ignore change if there's an override set
            if (document.documentElement.getAttribute('data-bs-theme')) {
              return;
            }

            // Apply color mode.
            wml.setColorMode(options.colorMode);

            // Make sure the checkbox is up-to-date
            toggleDarkMode.checked = mediaQuery.matches;
          });

          /**
           * Load sound font
           *
           * @param {File} file
           */
          const handleSoundFont = file => {
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = e => {
              document.getElementById('soundfont').innerText = file.name;
              const data = new Uint8Array(e.target.result);
              wml.setupByBuffer(data);
            };
          };

          // When select SoundFont file
          fileInput.addEventListener(
            'change',
            event => {
              event.preventDefault();
              handleSoundFont(fileInput.files[0]);
              fileInput.value = '';
            },
            false
          );

          // When SoundFont Drag and Drop.
          dragArea.addEventListener(
            'drop',
            event => {
              const dt = event.dataTransfer;
              if (dt.files.length) {
                event.preventDefault();
                event.stopPropagation();
                handleSoundFont(dt.files[0]);
              }
              dragArea.classList.remove('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragover',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.add('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragleave',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.remove('bg-info');
            },
            false
          );

          // Toggle Dark mode
          toggleDarkMode.addEventListener('change', e => {
            wml.setColorMode(e.target.checked ? 'dark' : 'light');
          });

          /*
          selector.addEventListener('change', () => {
            console.log(selector.value);
            wml.setup(
              `https://cdn.jsdelivr.net/npm/@logue/sf2synth@latest/dist/${selector.value}`
            );
          });
          */
        },
        false
      );

      window.addEventListener(
        'hashchange',
        () => {
          const url = qs.parse(window.location.hash);
          if (url) {
            wml.setup(url);
          }
        },
        false
      );
    </script>
  </body>
</html>
