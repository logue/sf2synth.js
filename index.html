<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="robots" content="noindex" />
    <title>Web Midi Link</title>
    <link rel="stylesheet" lang="scss" href="/src/wml.scss" />
  </head>

  <body>
    <div class="container-fluid">
      <header>
        <h1 class="h2">
          SoundFont:
          <span id="soundfont"></span>
        </h1>
        <p class="text-end">
          <a href="https://logue.dev/" target="_blank">Logue</a>
          /
          <small class="text-muted">
            Last Modified:
            <span id="build"></span>
          </small>
        </p>
      </header>
      <main>
        <div id="drag">
          <label class="form-label" for="file">
            Load SoundFont2 file
            <small class="text-muted">
              (drag and drop here *.sf2 file to change sound font)
            </small>
          </label>
          <input
            type="file"
            class="form-control"
            id="file"
            accept="audio/x-soundfont"
          />
        </div>
        <hr />
        <div id="placeholder"></div>
      </main>
    </div>
    <script type="module">
      import queryString from 'query-string';
      import SoundFont from '/src/index';

      /** Query string */
      const qs = queryString.parse(window.location.search);
      /** sf2synth.js Option */
      const option = { placeholder: 'placeholder' };
      if (qs.ui === 'false') {
        option.drawSynth = false;
      }
      document.addEventListener(
        'DOMContentLoaded',
        event => {
          /** WebMidiLink */
          const wml = new SoundFont.WebMidiLink(option);
          /** Message DOM */
          const message = document.getElementById('message');
          /** File Input Form */
          const fileInput = document.getElementById('file');
          /** Placeholder */
          const placeholder = document.getElementById('placeholder');
          /** drag */
          const dragArea = document.getElementById('drag');

          /** SoundFont file */
          const sf = qs.soundfont
            ? decodeURIComponent(qs.soundfont)
            : 'Yamaha XG Sound Set.sf2';

          document.getElementById('soundfont').innerText = sf;

          document.getElementById('build').innerText = new Date(
            SoundFont.build
          ).toLocaleString();
          wml.setLoadCallback(() => {
            // message.style.display = 'none';
          });
          wml.setup(sf);

          /** Load sound font
           * @param {File} file
           */
          const handleSoundFont = file => {
            const reader = new FileReader();

            // wml.cancelLoading();

            reader.readAsArrayBuffer(file);

            reader.onload = e => {
              document.getElementById('soundfont').innerText = file.name;
              const data = new Uint8Array(e.target.result);
              wml.setupByBuffer(data);
            };
          };

          fileInput.addEventListener(
            'change',
            event => {
              event.preventDefault();
              handleSoundFont(fileInput.files[0]);
              fileInput.value = '';
            },
            false
          );

          dragArea.addEventListener(
            'drop',
            event => {
              const dt = event.dataTransfer;
              console.log(dt);
              if (dt.files.length) {
                event.preventDefault();
                event.stopPropagation();
                handleSoundFont(dt.files[0]);
              }
              fileInput.classList.remove('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragover',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.add('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragleave',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.remove('bg-info');
            },
            false
          );
        },
        false
      );
    </script>
  </body>
</html>
