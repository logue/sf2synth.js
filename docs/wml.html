<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="robots" content="noindex" />
    <title>Web Midi Link</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container-fluid">
      <header>
        <h1 class="h2">
          SoundFont:
          <span id="soundfont"></span>
        </h1>
        <p class="text-end">
          By
          <a href="https://logue.dev/" target="_blank">Logue</a>
          /
          <small class="text-muted">
            Last Modified:
            <span id="build"></span>
          </small>
        </p>
      </header>
      <main>
        <div class="mb-3">
          <label class="form-label" for="file">
            Load SoundFont2 file
            <small class="text-muted">
              (drag and drop here *.sf2 file to change sound font)
            </small>
          </label>
          <input
            type="file"
            class="form-control"
            id="file"
            accept="audio/x-soundfont"
          />
        </div>
        <div id="placeholder"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/query-string@1.0.1/query-string.min.js"></script>
    <script src="sf2synth.umd.js"></script>
    <script>
      const message = document.getElementById('message');
      const qs = queryString.parse(window.location.search);

      const option = { placeholder: 'placeholder' };
      if (qs.ui === 'false') {
        option.drawSynth = false;
      }
      const sf = qs.soundfont
        ? decodeURIComponent(qs.soundfont)
        : 'Yamaha XG Sound Set.sf2';
      document.getElementById('soundfont').innerText = sf;

      const wml = new SoundFont.WebMidiLink(option);
      document.getElementById('build').innerText = new Date(
        wml.build
      ).toLocaleString();
      wml.setLoadCallback(() => {
        message.style.display = 'none';
      });
      wml.setup(sf);

      // Load sound font
      const handleSoundFont = file => {
        const reader = new FileReader();

        // wml.cancelLoading();

        reader.readAsArrayBuffer(file);

        reader.onload = function (e) {
          var data = new Uint8Array(e.target.result);
          wml.loadSoundFont(data);
        };
      };

      // local file
      window.addEventListener(
        'DOMContentLoaded',
        event => {
          // File selector
          const fileElement = document.getElementById('file');
          document.getElementById('file').addEventListener(
            'change',
            event => {
              var file = document.getElementById('file').files[0];
              handleSoundFont(file);
              event.preventDefault();
            },
            false
          );

          const droparea = document.getElementById('placeholder');
          droparea.addEventListener(
            'dragover',
            e => {
              droparea.className = 'alert-danger';
              e.preventDefault();
            },
            true
          );

          droparea.addEventListener(
            'drop',
            e => {
              droparea.className = '';
              var dt = e.dataTransfer;
              var files = dt.files;
              e.stopPropagation();
              e.preventDefault();
              handleSoundFont(files[0]);
            },
            true
          );

          droparea.addEventListener(
            'dragleave',
            e => {
              droparea.className = '';
            },
            true
          );
        },
        false
      );
    </script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-2Y2FW3QEG4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-2Y2FW3QEG4');
    </script>
  </body>
</html>
