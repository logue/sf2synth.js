<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Web Midi Link</title>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'UA-33600926-1');
    </script>
    <!-- End Google Tag Manager -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@logue/sf2synth@latest/dist/style.css" />
  </head>

  <body>
    <div class="container-fluid">
      <header>
        <h1 class="h2">
          SoundFont:
          <span id="soundfont"></span>
        </h1>
        <p class="text-end">
          <a href="https://logue.dev/" target="_blank">Logue</a>
          /
          <small class="text-muted">
            Last Modified:
            <span id="build"></span>
          </small>
        </p>
      </header>
      <main>
        <div id="drag">
          <label class="form-label" for="file">
            Load SoundFont2 file
            <small class="text-muted">
              (drag and drop here *.sf2 file to change sound font)
            </small>
          </label>
          <input
            type="file"
            class="form-control"
            id="file"
            accept="audio/x-soundfont"
          />
        </div>
        <hr />
        <div id="placeholder"></div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/query-string@1.0.1/query-string.js"
      integrity="sha256-grrS5HRy2p4Z2sCglfc9r6rqRBewKCdWzuWhbUpIEJ4="
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@logue/sf2synth@latest/dist/sf2synth.umd.min.js"></script>

    <script>
      /** Query string */
      const qs = queryString.parse(window.location.search);
      /** sf2synth.js Option */
      const option = { placeholder: 'placeholder' };
      if (qs.ui === 'false') {
        option.drawSynth = false;
      }
      document.addEventListener(
        'DOMContentLoaded',
        event => {
           /** WebMidiLink */
          const wml = new SoundFont.WebMidiLink(option);
          /** @type {HTMLDivElement} Message DOM */
          const message = document.getElementById('message');
          /** @type {HTMLInputElement} File Input Form */
          const fileInput = document.getElementById('file');
          /** @type {HTMLDivElement} Placeholder */
          const placeholder = document.getElementById('placeholder');
          /** @type {HTMLDivElement} drag area */
          const dragArea = document.getElementById('drag');
          /** @type {HTMLTimeElement} Build Date */
          const build = document.getElementById('build');

          /** SoundFont file */
          const sf = qs.soundfont
            ? decodeURIComponent(qs.soundfont)
            : 'Yamaha XG Sound Set.sf2';

          document.getElementById('soundfont').innerText = sf;

          build.dateTime = SoundFont.build;
          build.innerText = new Date(SoundFont.build).toLocaleString();

          wml.setLoadCallback(() => {
            // message.style.display = 'none';
          });
          wml.setup(sf);

          /** Load sound font
           * @param {File} file
           */
          const handleSoundFont = file => {
            const reader = new FileReader();

            // wml.cancelLoading();

            reader.readAsArrayBuffer(file);

            reader.onload = e => {
              document.getElementById('soundfont').innerText = file.name;
              const data = new Uint8Array(e.target.result);
              wml.setupByBuffer(data);
            };
          };

          fileInput.addEventListener(
            'change',
            event => {
              event.preventDefault();
              handleSoundFont(fileInput.files[0]);
              fileInput.value = '';
            },
            false
          );

          dragArea.addEventListener(
            'drop',
            event => {
              const dt = event.dataTransfer;
              console.log(dt);
              if (dt.files.length) {
                event.preventDefault();
                event.stopPropagation();
                handleSoundFont(dt.files[0]);
              }
              fileInput.classList.remove('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragover',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.add('bg-info');
            },
            false
          );
          dragArea.addEventListener(
            'dragleave',
            event => {
              event.preventDefault();
              event.stopPropagation();
              dragArea.classList.remove('bg-info');
            },
            false
          );
        },
        false
      );
    </script>
  </body>
</html>
